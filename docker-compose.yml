services:
  postgres:
    image: postgres:17-alpine
    container_name: shortener-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shortener -d shortener']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=100

  redis:
    image: redis:8-alpine
    container_name: shortener-redis
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'no',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  pgdata:
  redisdata:
